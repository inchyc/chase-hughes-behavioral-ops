<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A0E14" />
  <link rel="manifest" href="/manifest.json" />
  <title>NCI Behavioral Ops & 6MX Field Trainer</title>
  <style>
    :root {
      --bg: #0A0E14;
      --surface: #121822;
      --card: #18202C;
      --border: #263244;
      --cyan: #00E5FF;
      --amber: #FFB300;
      --crimson: #FF5252;
      --emerald: #00E676;
      --purple: #B388FF;
      --text: #ECEFF4;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 84px;
      user-select: none;
    }
    .container { max-width: 540px; margin: 0 auto; padding: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-surface { background: var(--surface); }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.8px;
    }
    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1, h2, h3, p { margin: 0; }
    .title-lg { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .row { display: flex; gap: 8px; align-items: center; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button {
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 10px 12px;
      font-size: 12px;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    .btn-cyan { background: var(--cyan); color: #051318; border-color: var(--cyan); font-weight: 800; }
    .btn-amber { background: var(--amber); color: #1F1400; border-color: var(--amber); font-weight: 800; }
    .btn-emerald { background: var(--emerald); color: #041F10; border-color: var(--emerald); font-weight: 800; }
    .btn-crimson { background: var(--crimson); color: #240404; border-color: var(--crimson); font-weight: 800; }
    .btn-outline-cyan { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,0.1); }
    .btn-outline-amber { border-color: var(--amber); color: var(--amber); background: rgba(255,179,0,0.1); }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      margin-top: 6px;
      margin-bottom: 10px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px 12px;
      z-index: 100;
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-btn.active { color: var(--cyan); }
    .nav-code { font-size: 10px; font-weight: 800; }
    .nav-label { font-size: 11px; }
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.25s ease; }
    .stealth-quadrant {
      height: 190px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      text-align: center;
      background: var(--surface);
    }
  </style>
</head>

    const ACADEMY_LESSONS = [
      { id: "l1", track: "6MX", title: "Six-Minute X-Ray: The 6 Social Needs & 6 Decision Styles", body: "Every human is driven by 2 primary Social Needs (Significance, Approval, Acceptance, Intelligence, Pity, Power) and 1 Decision Style (Analytical, Belief, Leader, Social, Necessity, Impulsive). Feed their Social Need to trigger oxytocin homeostasis; structure choices around their Decision Style." },
      { id: "l2", track: "BOM", title: "Behavior Ops Manual: The 7-Second Rule & >= 11 BTE Threshold", body: "Isolated body language cues mean nothing. A valid deception/stress cluster requires: 1) Deviation from baseline (or multi-channel Hot-Start cluster), 2) Occurring within 0–7 seconds of a stimulus, and 3) Summing to >= 11 BTE points." },
      { id: "l3", track: "ELP", title: "The Ellipsis Manual: FATE, Authority Pyramid & Linguistic Harvesting", body: "Decelerate physical movement by 20% and use downward vocal inflections to project primal Authority. Harvest 3 exact predicate words the subject uses and echo them back verbatim while climbing a 3-step Compliance Ladder." },
      { id: "l4", track: "TRC", title: "The Trust Code: Oxytocin vs. Cortisol & Controlled Vulnerability", body: "Audit Authenticity, Empathy, and Logic. Deploy a small 'Controlled Vulnerability' admission early in an interaction to disarm skepticism and trigger mammalian oxytocin." },
      { id: "l5", track: "NCI 1-4", title: "NCI Levels 1–4: Comfort vs. Discomfort, Elicitation & Cognitive Load", body: "Level 1: Read Ventral Fronting vs. Ventral Denial & Lead-Foot exit pivots. Level 2: Replace direct questions with Elicitation statements & spot Pronoun Drops. Levels 3–4: Impose cognitive load and track multi-channel BTE incongruence (Sh=5, Ci=5, Fd=4)." }
    ];

    // ========================================================
    // PERSISTED STATE ENGINE
    // ========================================================
    const STORAGE_KEY = "nci_behavioral_ops_web_v1";
    let state = loadState();
    let currentTab = "COMMAND";
    let stealthMode = false;
    let bteSubTab = "SCORER";
    let selectedCueCardId = "sig";
    let srsRevealed = false;
    let srsIndex = 0;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        xp: 0,
        streak: 0,
        lastActiveDate: new Date().toISOString().slice(0, 10),
        activeMissionId: "op_t1_01",
        stealthTallies: [0, 0, 0, 0],
        completedMissions: [],
        debriefs: [],
        habits: [
          { id: "h1", title: "Downward Vocal Inflection (Authority)", target: 5, today: 0, total: 0 },
          { id: "h2", title: "Conscious Ventral Fronting + Open Palms", target: 5, today: 0, total: 0 },
          { id: "h3", title: "Swap Question for Elicitation Statement", target: 3, today: 0, total: 0 },
          { id: "h4", title: "Harvest & Echo 1 Exact Predicate Word", target: 3, today: 0, total: 0 },
          { id: "h5", title: "15-Second Baseline Read Before Speaking", target: 4, today: 0, total: 0 }
        ],
        bteBaselineLocked: false,
        bteBaselineSkipped: false,
        bteBaselineSummary: "Normal Blink (12-18/m) • Ventral Fronting",
        bteActiveIds: [],
        flashcards: [
          { id: "fc1", badge: "BOM", q: "What are the 3 mandatory rules for a valid BTE deception/stress cluster?", a: "1) Deviation from baseline\n2) Within 0–7 seconds after stimulus\n3) Cluster score >= 11 BTE points across multiple channels.", interval: 1 },
          { id: "fc2", badge: "6MX", q: "How does Acceptance (ACC) differ from Significance (SIG) in Six-Minute X-Ray?", a: "Significance wants to stand OUT as elite/unique; Acceptance wants to fit IN safely with the tribe without being singled out.", interval: 1 },
          { id: "fc3", badge: "NCI-2", q: "What are 3 Elicitation Statements to extract info without asking direct questions?", a: "1) Assumptive/Provocative Statement\n2) Mild Disbelief / Flattery Trap\n3) Quoting a Third Party ('Most people say...')", interval: 2 },
          { id: "fc4", badge: "TRC", q: "How do you fix an Authenticity Wobble in The Trust Code?", a: "Deploy 'Controlled Vulnerability'—proactively admit a small, low-stakes human flaw early so everything else you say becomes 3x more believable.", interval: 3 }
        ]
      };
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function vibrate(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
    }

    function switchTab(tab, openStealth = false) {
      vibrate(20);
      currentTab = tab;
      stealthMode = openStealth;
      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
      const activeBtn = document.getElementById("nav-" + tab);
      if (activeBtn) activeBtn.classList.add("active");
      render();
    }

    // ========================================================
    // RENDER VIEWS
    // ========================================================
    function render() {
      const root = document.getElementById("app");
      if (currentTab === "COMMAND") root.innerHTML = renderCommand();
      else if (currentTab === "FIELD_OPS") root.innerHTML = renderFieldOps();
      else if (currentTab === "BTE_LAB") root.innerHTML = renderBteLab();
      else if (currentTab === "TOOLKIT") root.innerHTML = renderToolkit();
      else if (currentTab === "ACADEMY") root.innerHTML = renderAcademy();
    }

    function renderCommand() {
      const mission = FIELD_MISSIONS.find(m => m.id === state.activeMissionId) || FIELD_MISSIONS[0];
      return `
        <div class="card">
          <div class="between">
            <div>
              <div class="eyebrow">Behavioral Ops Command</div>
              <div class="title-lg">NCI & Ellipsis Field Trainer</div>
            </div>
            <span class="badge" style="background:rgba(0,229,255,0.15);color:var(--cyan);border:1px solid var(--cyan)">
              ${state.xp} XP • ${state.streak}d Streak
            </span>
          </div>
          <div class="grid-3" style="margin-top:12px">
            <button class="btn-outline-amber" onclick="switchTab('TOOLKIT')">30s Cue Cards</button>
            <button class="btn-outline-cyan" onclick="switchTab('BTE_LAB')">Live BTE Scorer</button>
            <button onclick="switchTab('ACADEMY')">SRS Deck (${state.flashcards.length})</button>
          </div>
        </div>

        <div class="card card-surface" style="border-color:var(--cyan)">
          <div class="between">
            <span class="eyebrow">${mission.tierName}</span>
            <span style="color:var(--emerald);font-size:12px;font-weight:800">+${mission.xp} XP</span>
          </div>
          <h3 style="font-size:17px;margin:4px 0">${mission.code}: ${mission.title}</h3>
          <div style="color:var(--amber);font-size:12px;margin-bottom:8px">${mission.source} • ${mission.duration}</div>
          <p class="muted">${mission.objective}</p>
          <div class="row" style="margin-top:12px">
            <button class="btn-cyan" style="flex:2" onclick="switchTab('FIELD_OPS', true)">Launch No-Look Stealth Tally</button>
            <button style="flex:1" onclick="switchTab('FIELD_OPS', false)">All Missions</button>
          </div>
        </div>

        <div class="card">
          <div class="eyebrow" style="color:var(--emerald)">Automaticity & Micro-Habit Reps</div>
          <p class="muted" style="margin-bottom:12px">Condition core behavioral reflexes daily so they fire automatically under high-stakes social pressure.</p>
          ${state.habits.map(h => `
            <div style="background:var(--bg);border:1px solid ${h.today >= h.target ? 'var(--emerald)' : 'var(--border)'};border-radius:10px;padding:10px 12px;margin-bottom:8px" class="between">
              <div style="flex:1">
                <div style="font-size:13px;font-weight:700;color:${h.today >= h.target ? 'var(--emerald)' : 'var(--text)'}">${h.title}</div>
                <div style="font-size:11px;color:var(--amber);margin-top:3px">Today: ${h.today}/${h.target} • Lifetime: ${h.total} reps</div>
              </div>
              <button class="${h.today >= h.target ? 'btn-emerald' : 'btn-cyan'}" onclick="incrementHabit('${h.id}')">+1 Rep</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    function incrementHabit(id) {
      vibrate(30);
      const h = state.habits.find(x => x.id === id);
      if (h) { h.today++; h.total++; state.xp += 15; saveState(); render(); }
    }

    function renderFieldOps() {
      const mission = FIELD_MISSIONS.find(m => m.id === state.activeMissionId) || FIELD_MISSIONS[0];
      if (stealthMode) {
        const colors = ["var(--cyan)", "var(--amber)", "var(--crimson)", "var(--emerald)"];
        return `
          <div class="card between">
            <div>
              <div class="eyebrow" style="color:var(--amber)">No-Look Haptic Stealth Tally • ${mission.code}</div>
              <div class="muted" style="font-size:11px">Tap quadrants by thumb feel in your hand/pocket without looking at the screen.</div>
            </div>
            <button onclick="stealthMode=false;render()">Exit</button>
          </div>
          <div class="grid-2" style="margin-bottom:14px">
            ${mission.quadrants.map((q, idx) => `
              <div class="stealth-quadrant" style="border:2px solid ${colors[idx]}" onclick="tapStealth(${idx})">
                <span style="font-size:10px;color:var(--muted);font-weight:800">QUADRANT ${idx + 1}</span>
                <span style="font-size:46px;font-weight:900;color:${colors[idx]}">${state.stealthTallies[idx] || 0}</span>
                <span style="font-size:14px;font-weight:800">${q}</span>
              </div>
            `).join("")}
          </div>
          <div class="row">
            <button style="flex:1" onclick="state.stealthTallies=[0,0,0,0];saveState();render()">Zero Tallies</button>
            <button class="btn-emerald" style="flex:2" onclick="completeFieldOp()">Complete Op & Claim +${mission.xp} XP</button>
          </div>
        `;
      }

      return `
        <div class="eyebrow">Progressive Field Operations (Tiers 1–5)</div>
        <div class="title-lg">Real-World Confidence & Profiling Ladder</div>
        <p class="muted" style="margin-bottom:12px">Start with Tier 1 Zero-Contact Recon outside of conversation and work up to full conversational Elicitation and Ellipsis mastery.</p>

        ${FIELD_MISSIONS.map(m => {
          const active = m.id === mission.id;
          const done = state.completedMissions.includes(m.id);
          return `
            <div class="card" style="border-color:${active ? 'var(--cyan)' : 'var(--border)'};cursor:pointer" onclick="state.activeMissionId='${m.id}';saveState();render()">
              <div class="between">
                <span class="eyebrow" style="color:${done ? 'var(--emerald)' : 'var(--cyan)'}">${done ? '✓ COMPLETED • ' : ''}${m.tierName}</span>
                <span style="font-size:12px;color:var(--amber);font-weight:800">${m.duration} • +${m.xp} XP</span>
              </div>
              <h3 style="font-size:16px;margin:4px 0">${m.code}: ${m.title}</h3>
              <p class="muted" style="font-size:12px">${m.objective}</p>
              ${active ? `
                <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
                  <div class="eyebrow" style="color:var(--amber);margin-bottom:6px">Pre-Flight Briefing</div>
                  ${m.briefing.map((b, i) => `<div class="muted" style="font-size:12px;margin-bottom:4px">${i+1}. ${b}</div>`).join("")}
                  <div class="row" style="margin-top:10px">
                    <button class="btn-cyan" style="flex:2" onclick="event.stopPropagation();stealthMode=true;render()">Enter No-Look Haptic Stealth Tally</button>
                    <button class="btn-emerald" style="flex:1" onclick="event.stopPropagation();completeFieldOp()">Complete Op</button>
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }).join("")}
      `;
    }

    function tapStealth(idx) {
      vibrate(idx === 0 ? 25 : [35, 50, 45]);
      state.stealthTallies[idx] = (state.stealthTallies[idx] || 0) + 1;
      saveState();
      render();
    }

    function completeFieldOp() {
      const mission = FIELD_MISSIONS.find(m => m.id === state.activeMissionId) || FIELD_MISSIONS[0];
      vibrate([80, 50, 120]);
      state.xp += mission.xp;
      if (!state.completedMissions.includes(mission.id)) state.completedMissions.push(mission.id);
      state.stealthTallies = [0, 0, 0, 0];
      stealthMode = false;
      saveState();
      render();
    }

    function renderBteLab() {
      // Calculate active BTE score
      const activeEls = BTE_ELEMENTS.filter(e => state.bteActiveIds.includes(e.id));
      const score = activeEls.filter(e => !e.comfort).reduce((sum, e) => sum + e.pts, 0);
      const crossed = score >= 11;

      if (!state.bteBaselineLocked) {
        return `
          <div class="eyebrow">Behavioral Table of Elements (BTE) Lab</div>
          <div class="title-lg">Step 1: Baseline Calibration (or Skip)</div>
          <div class="card" style="border-color:var(--amber)">
            <div class="between" style="margin-bottom:8px">
              <span class="eyebrow" style="color:var(--amber)">30-Second Baseline Prompt</span>
              <span class="badge" style="background:rgba(0,229,255,0.15);color:var(--cyan)">NCI Protocol</span>
            </div>
            <p class="muted" style="margin-bottom:12px">
              Establish a 30-second resting baseline before scoring deviations—OR tap <strong>Skip Baseline (Hot Start)</strong> below when you are dropped straight into an interaction without time to calibrate.
            </p>
            <button class="btn-amber" style="width:100%;margin-bottom:12px;padding:12px" onclick="skipBteBaseline()">
              ⚡ Skip Baseline (Hot Start / Immediate BTE Scoring)
            </button>
            <button class="btn-emerald" style="width:100%;padding:12px" onclick="lockCalibratedBaseline()">
              ✓ Lock 30s Calibrated Baseline & Open BTE Scorer
            </button>
          </div>
        `;
      }

      return `
        <div class="eyebrow">Behavioral Table of Elements (BTE) Scorer</div>
        <div class="card" style="border:2px solid ${crossed ? 'var(--crimson)' : 'var(--cyan)'}">
          <div class="between">
            <div>
              <div style="font-size:11px;font-weight:800;color:${state.bteBaselineSkipped ? 'var(--amber)' : 'var(--emerald)'}">
                ${state.bteBaselineSkipped ? '⚠️ HOT START MODE (BASELINE SKIPPED)' : '✓ CALIBRATED BASELINE LOCKED'}
              </div>
              <div class="muted" style="font-size:11px">
                ${state.bteBaselineSkipped ? 'Rely on multi-channel clusters within 7s of stimulus.' : state.bteBaselineSummary}
              </div>
            </div>
            <button onclick="resetBte()">Reset / Re-Baseline</button>
          </div>
          <div class="between" style="margin-top:12px">
            <div>
              <div class="muted" style="font-size:11px;font-weight:700">7-SECOND BTE CLUSTER SCORE</div>
              <div style="font-size:32px;font-weight:900;color:${crossed ? 'var(--crimson)' : 'var(--cyan)'}">${score} / 11 pts</div>
            </div>
            <span class="badge" style="background:${crossed ? 'var(--crimson)' : 'var(--bg)'};color:${crossed ? '#1A0000' : 'var(--muted)'};border:1px solid var(--border);padding:8px 10px">
              ${crossed ? '🚨 >= 11 THRESHOLD CROSSED' : (11 - score) + ' pts to threshold'}
            </span>
          </div>
        </div>

        <div class="muted" style="font-size:11px;font-weight:800;margin-bottom:8px">TAP CUES OBSERVED WITHIN 7 SECONDS OF STIMULUS:</div>
        <div class="grid-2">
          ${BTE_ELEMENTS.map(el => {
            const selected = state.bteActiveIds.includes(el.id);
            const color = el.comfort ? 'var(--emerald)' : (el.pts >= 4 ? 'var(--crimson)' : 'var(--amber)');
            return `
              <div class="card" style="margin-bottom:0;padding:10px;border:${selected ? '2px' : '1px'} solid ${selected ? color : 'var(--border)'};cursor:pointer" onclick="toggleBteCue('${el.id}')">
                <div class="row">
                  <span class="badge" style="border:1px solid ${color};color:${color};font-size:13px">${el.symbol}</span>
                  <div>
                    <div style="font-size:12px;font-weight:800">${el.name}</div>
                    <div style="font-size:10px;color:${color};font-weight:700">${el.comfort ? 'Comfort Cue' : '+' + el.pts + ' BTE pts'} • ${el.zone}</div>
                  </div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function skipBteBaseline() {
      vibrate([35, 50, 45]);
      state.bteBaselineLocked = true;
      state.bteBaselineSkipped = true;
      saveState();
      render();
    }

    function lockCalibratedBaseline() {
      vibrate(25);
      state.bteBaselineLocked = true;
      state.bteBaselineSkipped = false;
      saveState();
      render();
    }

    function resetBte() {
      vibrate(20);
      state.bteBaselineLocked = false;
      state.bteActiveIds = [];
      saveState();
      render();
    }

    function toggleBteCue(id) {
      vibrate(30);
      if (state.bteActiveIds.includes(id)) {
        state.bteActiveIds = state.bteActiveIds.filter(x => x !== id);
      } else {
        state.bteActiveIds.push(id);
      }
      saveState();
      render();
    }

    function renderToolkit() {
      const card = POCKET_CUE_CARDS.find(c => c.id === selectedCueCardId) || POCKET_CUE_CARDS[0];
      return `
        <div class="eyebrow">30-Second Pre-Meeting Pocket Cue Cards</div>
        <div class="title-lg">6MX Social Needs, FATE & Trust Code</div>
        <div class="grid-4" style="margin-bottom:14px">
          ${POCKET_CUE_CARDS.map(c => `
            <button class="${c.id === card.id ? 'btn-cyan' : ''}" onclick="selectedCueCardId='${c.id}';render()">
              ${c.title.split(" ")[0]}
            </button>
          `).join("")}
        </div>

        <div class="card card-surface" style="border-color:var(--cyan)">
          <div class="between">
            <span class="eyebrow" style="color:var(--amber)">${card.badge}</span>
            <span style="font-size:11px;color:var(--cyan);font-weight:800">30-SEC BRIEF</span>
          </div>
          <h2 style="font-size:20px;margin:6px 0">${card.title}</h2>
          <p class="muted" style="margin-bottom:12px">${card.summary}</p>

          <div class="card" style="background:var(--bg)">
            <div class="eyebrow">👁️ Visual & Verbal Tells</div>
            ${card.tells.map(t => `<div style="font-size:12px;margin-top:5px">• ${t}</div>`).join("")}
          </div>

          <div class="card" style="background:var(--bg);border-color:var(--emerald)">
            <div class="eyebrow" style="color:var(--emerald)">✓ Exact Phrases to Deploy</div>
            ${card.phrases.map(p => `<div style="font-size:13px;font-weight:700;margin-top:6px">• ${p}</div>`).join("")}
          </div>

          <div class="card" style="background:var(--bg);border-color:var(--crimson);margin-bottom:0">
            <div class="eyebrow" style="color:var(--crimson)">✗ Fatal Errors to Avoid</div>
            ${card.avoid.map(a => `<div style="font-size:12px;margin-top:5px">• ${a}</div>`).join("")}
          </div>
        </div>
      `;
    }

    function renderAcademy() {
      const card = state.flashcards[srsIndex % state.flashcards.length];
      return `
        <div class="eyebrow">NCI Levels 1–4 & Chase Hughes Books</div>
        <div class="title-lg">SM-2 Spaced Repetition & Codex</div>

        <div class="card card-surface" style="border-color:var(--purple)">
          <div class="between" style="margin-bottom:8px">
            <span class="eyebrow" style="color:var(--purple)">SM-2 Flashcard (${(srsIndex % state.flashcards.length) + 1}/${state.flashcards.length}) • ${card.badge}</span>
            <span class="muted" style="font-size:11px">Interval: ${card.interval}d</span>
          </div>
          <div style="font-size:16px;font-weight:800;line-height:1.4;margin-bottom:12px">${card.q}</div>
          ${!srsRevealed ? `
            <button class="btn-cyan" style="width:100%" onclick="srsRevealed=true;render()">Reveal Answer</button>
          ` : `
            <div style="padding:12px;background:var(--bg);border-radius:10px;border:1px solid var(--emerald);color:var(--emerald);font-size:14px;white-space:pre-line;margin-bottom:12px">${card.a}</div>
            <div class="grid-4">
              <button class="btn-crimson" onclick="gradeCard(1)">Again</button>
              <button class="btn-amber" onclick="gradeCard(2)">Hard</button>
              <button class="btn-cyan" onclick="gradeCard(4)">Good</button>
              <button class="btn-emerald" onclick="gradeCard(7)">Easy</button>
            </div>
          `}
        </div>

        <div class="eyebrow" style="margin-top:8px">Core Curriculum Summaries</div>
        ${ACADEMY_LESSONS.map(l => `
          <div class="card">
            <div class="eyebrow" style="color:var(--amber)">${l.track}</div>
            <h3 style="font-size:15px;margin:4px 0">${l.title}</h3>
            <p class="muted" style="font-size:12px">${l.body}</p>
          </div>
        `).join("")}
      `;
    }

    function gradeCard(mult) {
      vibrate(25);
      const card = state.flashcards[srsIndex % state.flashcards.length];
      card.interval = Math.max(1, card.interval * mult);
      state.xp += 20;
      srsRevealed = false;
      srsIndex++;
      saveState();
      render();
    }

    render();
  </script>
</body>
</html>
